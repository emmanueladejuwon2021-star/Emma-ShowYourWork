    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <title>Adejuwon Emmanuel | Web Developer</title>
    
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
      }
      html.dark, html.dark body {
        background-color: #050509;
        color: #ffffff;
      }
      html.light, html.light body {
        background-color: #fafaf9;
        color: #1a1a1a;
      }
    </style>
    
    <!-- Prevent FOUC: Apply theme before React loads -->
    <script>
      (function() {
        try {
          var stored = localStorage.getItem('ae-portfolio-theme');
          var theme;
          if (stored === 'light' || stored === 'dark') {
            theme = stored;
          } else if (window.matchMedia('(prefers-color-scheme: light)').matches) {
            theme = 'light';
          } else {
            theme = 'dark';
          }
          document.documentElement.classList.add(theme);
          document.documentElement.setAttribute('data-theme', theme);
          
          // Update theme-color meta tag
          var metaThemeColor = document.querySelector('meta[name="theme-color"]');
          if (metaThemeColor) {
            metaThemeColor.setAttribute('content', theme === 'dark' ? '#050509' : '#fafaf9');
          }
        } catch (e) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root">
      <noscript>
        <div style="padding: 2rem; text-align: center; font-family: Inter, sans-serif;">
          <h1 style="font-size: 2rem; margin-bottom: 1rem;">Adejuwon Emmanuel</h1>
          <p style="opacity: 0.6;">Please enable JavaScript to view this website.</p>
        </div>
      </noscript>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
