<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="textGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#8b5cf6"/>
      <stop offset="50%" style="stop-color:#d946ef"/>
      <stop offset="100%" style="stop-color:#f59e0b"/>
    </linearGradient>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#050509"/>
      <stop offset="100%" style="stop-color:#0a0a1a"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGradient)"/>
  
  <!-- Subtle grid pattern -->
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.02)" stroke-width="1"/>
  </pattern>
  <rect width="1200" height="630" fill="url(#grid)"/>
  
  <!-- Gradient orbs -->
  <circle cx="200" cy="150" r="200" fill="#8b5cf6" opacity="0.1" filter="blur(40px)"/>
  <circle cx="1000" cy="480" r="250" fill="#d946ef" opacity="0.08" filter="blur(50px)"/>
  
  <!-- Main text -->
  <text x="600" y="280" font-family="Inter, system-ui, sans-serif" font-size="72" font-weight="700" fill="#ffffff" text-anchor="middle">Adejuwon Emmanuel</text>
  
  <!-- Subtitle with gradient -->
  <text x="600" y="360" font-family="Inter, system-ui, sans-serif" font-size="36" font-weight="500" fill="url(#textGradient)" text-anchor="middle">Web Developer</text>
  
  <!-- Tagline -->
  <text x="600" y="440" font-family="Inter, system-ui, sans-serif" font-size="20" font-weight="400" fill="rgba(255,255,255,0.6)" text-anchor="middle">Crafting premium digital experiences</text>
  
  <!-- Bottom accent line -->
  <rect x="500" y="520" width="200" height="3" rx="1.5" fill="url(#textGradient)"/>
</svg>
